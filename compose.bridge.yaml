# 备选：不能用 host 网络时，改用端口映射。一般不需要它。
#
#   docker compose -f compose.bridge.yaml up -d
#
# 桥接容器连本机的飞牛音乐常被 NAS 防火墙挡住，relay 用来绕开，它不对外开端口。
name: trackferry

services:
  trackferry:
    # 其余设置与 compose.yaml 相同，先在那里改好
    extends: { file: compose.yaml, service: trackferry }
    network_mode: !reset null
    ports:
      - "18561:18561"
    volumes:
      - relay:/run/trackferry

  relay:
    image: madrays/trackferry:1.1.0
    container_name: trackferry-relay
    command: ["relay"]
    depends_on: [trackferry]
    restart: unless-stopped
    network_mode: host
    environment:
      # 飞牛的 HTTPS 端口，改过才需要动
      TRACKFERRY_RELAY_TARGET: "127.0.0.1:5667"
    volumes:
      - relay:/run/trackferry
    user: "10001:10001" # 与主服务同一个身份，才能共用通道
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    healthcheck: { disable: true }
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

volumes:
  relay:
